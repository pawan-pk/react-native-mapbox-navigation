buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["MapboxNavigation_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["MapboxNavigation_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["MapboxNavigation_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.mapboxnavigation"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "src/newarch",
          // This is needed to build Kotlin project with NewArch enabled
          "${project.buildDir}/generated/source/codegen/java"
        ]
      } else {
        java.srcDirs += ["src/oldarch"]
      }
    }
  }
  buildFeatures {
    viewBinding true
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // mapbox dependencies — Nav SDK 3.20.1 matches the iOS fork (MapboxMaps
  // 11.20.2 / MapboxCommon 24.20.2), so its transitive maps/common artifacts
  // dedupe with @rnmapbox/maps. Mirror rnmapbox's NDK 27 variant selection
  // (targetSdk >= 35 → -ndk27 artifacts for the 16KB page-size requirement);
  // mixing ndk27 and non-ndk27 Mapbox artifacts duplicates classes.
  def rnmbnvNavVersion = "3.20.1"
  // Maps SDK version the nav SDK pulls transitively (see comment above). Used
  // to pin the logo + attribution plugins explicitly: they're default MapView
  // plugins but aren't reliably on this module's compile classpath (the camera
  // pulls compass, but not every ornament plugin), and we reference their
  // `logo`/`attribution` extensions to keep attribution visible (ToS).
  def rnmbnvMapsVersion = "11.20.2"
  if (getExtOrIntegerDefault("targetSdkVersion") >= 35) {
    implementation "com.mapbox.navigationcore:navigation-ndk27:$rnmbnvNavVersion"
    implementation "com.mapbox.navigationcore:ui-components-ndk27:$rnmbnvNavVersion"
    implementation "com.mapbox.plugin:maps-logo-ndk27:$rnmbnvMapsVersion"
    implementation "com.mapbox.plugin:maps-attribution-ndk27:$rnmbnvMapsVersion"
  } else {
    implementation "com.mapbox.navigationcore:navigation:$rnmbnvNavVersion"
    implementation "com.mapbox.navigationcore:ui-components:$rnmbnvNavVersion"
    implementation "com.mapbox.plugin:maps-logo:$rnmbnvMapsVersion"
    implementation "com.mapbox.plugin:maps-attribution:$rnmbnvMapsVersion"
  }

  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  implementation 'androidx.cardview:cardview:1.0.0'
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "MapboxNavigationView"
    codegenJavaPackageName = "com.mapboxnavigation"
  }
}
